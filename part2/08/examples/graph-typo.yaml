start: write
max_attempts: 3
backoff_seconds: 2
retry_prompt: "앞 결과(draft.md)가 거부된 이유: {reason}. 이 이유만 고치세요."

steps:
  write:
    claude: prompt.md
    args: ["--allowedTools", "Read", "--disallowedTools", "Bash"]
    needs: [memo.md]
    output: draft.md
    next: check
  check:
    run: python check.py draft.md
    next: end
    on_reject: wirte
